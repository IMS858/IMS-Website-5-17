name: IMS website integrated release
on:
  push:
    branches: [main, 'release/ims-site-2026-09']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Archive exact source
        run: |
          git rev-parse HEAD > checked-head.txt
          git archive HEAD -o website-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: integrated-site-source-${{ github.event_name }}
          path: |
            checked-head.txt
            website-source.tar
          retention-days: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse every JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(git ls-files -z '*.js' '*.cjs' '*.mjs')
      - name: All website, API, contact, privacy and analytics regressions
        shell: bash
        run: |
          set -o pipefail
          node --test tests/*.test.cjs tests/*.test.mjs | tee site-tests.log
          if grep -Eq '# skipped [1-9]|# todo [1-9]' site-tests.log; then exit 1; fi
