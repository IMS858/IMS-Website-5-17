name: IMS website quality gate
on:
  push:
    branches: [main, audit/full-stack-hardening-2026-09]
  pull_request:
jobs:
  static-site-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: HTML navigation, SEO, accessibility and privacy checks
        run: node --test tests/site-quality.test.mjs
